<html lang="de">
<head>
<meta charset="utf-8">

<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self' https://api.github.com https://*.workers.dev; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none';">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
/* Layout: ein Bildschirm, eine Liste. Oben die Karte zur Tageszeit, darunter der Tag als Spalte mit Zeit am Rand. */
:root{
  --bg:#f4f1ea; --card:#ffffff; --ink:#1b1d24; --ink-soft:#5f6370; --ink-faint:#9a9eab; --line:#e4e1d9; --raised:#f8f6f1;
  --brass:#8a6420; --brass-tint:#f6efe0; --sky:#3f4ec2; --sky-tint:#ebedf9; --mint:#1e7a5a; --mint-tint:#e3f2ec; --rose:#a3343c; --rose-tint:#f9e8e9;
  --serif:ui-serif,"New York","Iowan Old Style",Palatino,Georgia,serif; --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  /* Namen, die übernommene Module erwarten */
  --sheen:27,32,51; --track:#ddd9ce; --hair:#d2cdc0; --on-accent:#fdfcf9; --font:var(--ui); --display:var(--ui); --mono:ui-monospace,"SF Mono",Menlo,monospace; --shadow:0 0 0 1px rgba(27,32,51,.07),0 18px 38px -24px rgba(27,32,51,.28); --radius:15px; --amber:var(--brass); --amber-tint:var(--brass-tint); --t3:var(--mint); --t4:var(--brass); --read-size:16px; --ui-font:var(--ui);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#15161b; --card:#1e2027; --ink:#ecebe6; --ink-soft:#aeb1bb; --ink-faint:#6d717d; --line:#2d303a; --raised:#242730; --brass:#d2aa5a; --brass-tint:#2c2718; --sky:#9aa3ff; --sky-tint:#242742; --mint:#5fd0a3; --mint-tint:#173126; --rose:#f08a90; --rose-tint:#3a2023; --sheen:255,255,255; --track:#3a3d48; --hair:#383b46; --on-accent:#10141f; --shadow:0 0 0 1px rgba(255,255,255,.05),0 22px 46px -26px rgba(0,0,0,.8); color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#15161b; --card:#1e2027; --ink:#ecebe6; --ink-soft:#aeb1bb; --ink-faint:#6d717d; --line:#2d303a; --raised:#242730; --brass:#d2aa5a; --brass-tint:#2c2718; --sky:#9aa3ff; --sky-tint:#242742; --mint:#5fd0a3; --mint-tint:#173126; --rose:#f08a90; --rose-tint:#3a2023; --sheen:255,255,255; --track:#3a3d48; --hair:#383b46; --on-accent:#10141f; --shadow:0 0 0 1px rgba(255,255,255,.05),0 22px 46px -26px rgba(0,0,0,.8); color-scheme:dark }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--ui);-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
a{color:var(--brass)}
.app{max-width:600px;margin:0 auto;padding-block:12px 150px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media(min-width:900px){.app{max-width:680px}}
.blick{display:none}.blick.an{display:block}
.kopf{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.kopf h1{font-size:27px;font-weight:700;letter-spacing:-.02em}
.kopf .datum{font-size:13px;color:var(--ink-soft);padding:4px 0}
.tagnav{display:flex;align-items:center;gap:2px}.tagnav .pfeil{width:34px;height:34px;border-radius:50%;color:var(--ink-faint);font-size:20px;display:grid;place-items:center}.tagnav .pfeil:hover{background:var(--raised);color:var(--ink)}
.ebr{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);font-weight:700;margin-bottom:8px}
.fl{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);margin:10px 0 2px}
.leise{font-size:12.5px;color:var(--ink-faint);line-height:1.5;margin:6px 0}
.notiz{font-size:13px;color:var(--ink-soft);line-height:1.5;margin:0 0 10px}
.fehler{color:var(--rose);font-size:13px;margin:4px 0}.fehler:empty{display:none}
.leer{font-size:12.5px;color:var(--ink-faint);margin:6px 0;padding:0 2px}
.btn{min-height:42px;padding:0 18px;border-radius:12px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.primär{background:var(--ink);color:var(--bg)}.btn.leise{color:var(--brass);padding:0 6px}.btn.rot{color:var(--rose)}.btn.klein{min-height:34px;padding:0 12px;font-size:13px}
.akt{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}.akt.links{margin-top:8px;gap:4px 16px}.akt.links .btn.leise{min-height:30px;font-size:13px;padding:0 2px}.akt.klein{margin-top:6px;gap:6px}
.chip{font-size:13px;padding:7px 11px;border-radius:9px;background:var(--raised);color:var(--ink);border:1px solid var(--line);min-height:34px;display:inline-flex;align-items:center;gap:5px}
.chip[aria-pressed="true"],.chip.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.chip.klein{min-height:28px;padding:3px 9px;font-size:12px}.chip.rot{color:var(--rose)}.chip.ok{border-color:var(--mint);color:var(--mint)}.chip.next{border-color:var(--brass);color:var(--brass)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}

/* Schalter */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;margin:0 0 12px;background:var(--card)}.segb{min-height:30px;padding:0 14px;border-radius:999px;font-size:13px;color:var(--ink-soft)}.segb[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
/* Die Karte oben */
.jetzt{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;margin-bottom:22px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.jetzt h2{font-size:21px;font-weight:700;letter-spacing:-.01em;margin-bottom:6px}
.jetzt p{margin:0;color:var(--ink-soft);font-size:14px}
.jetzt .hinweis{font-family:var(--serif);font-style:italic;color:var(--ink-soft);font-size:15.5px;line-height:1.6;margin-top:8px}
.jetzt .gebet{font-family:var(--serif);white-space:pre-line;font-size:16px;line-height:1.7;color:var(--ink);margin:12px 0}
.schritte{display:flex;gap:5px;margin:2px 0 14px}.schritte i{flex:1;height:3px;border-radius:2px;background:var(--line)}.schritte i.an{background:var(--brass)}
.naechst{display:flex;align-items:center;gap:14px;margin:4px 0 6px}.naechst .uhrz{font-variant-numeric:tabular-nums;font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1}.naechst .was{min-width:0}.naechst .was b{display:block;font-size:17px;font-weight:600;overflow-wrap:anywhere}.naechst .was span{color:var(--ink-soft);font-size:13px}
.gestern{border-left:2px solid var(--line);padding-left:12px;margin:10px 0 4px;color:var(--ink-soft);font-size:14px}.gestern p{margin:3px 0}.gestern b{color:var(--ink);font-weight:600}.gestern .btn{margin-top:6px}
.stern{margin:12px 0 4px}.stern p{font-family:var(--serif);font-size:16px;line-height:1.5;color:var(--ink);margin:2px 0}
.satz{font-family:var(--serif);font-size:17px;line-height:1.6;color:var(--ink);margin:6px 2px 26px;max-width:48ch;cursor:pointer}.satz span{display:block;font-family:var(--ui);font-size:12px;color:var(--ink-faint);margin-top:6px}.satz.klein{font-size:14.5px;margin:10px 0 4px;color:var(--ink-soft)}
.feld{margin:12px 0 4px}.feld.gross .ta{min-height:80px}
.ta{display:block;width:100%;border:0;border-bottom:1px dashed var(--line);border-radius:0;background:transparent;font:inherit;font-size:15px;line-height:1.5;color:var(--ink);padding:6px 0;resize:none;min-height:34px;overflow:hidden;outline:none}
.ta::placeholder{color:var(--ink-faint)}.ta:focus{border-bottom-color:var(--brass)}
.maske{display:flex;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);color:var(--ink-faint);letter-spacing:.2em}.maske .fl{margin:0;letter-spacing:.06em}
.mehr{margin:6px 0 2px}.mehr summary{font-size:13px;color:var(--ink-soft);cursor:pointer;min-height:32px;display:flex;align-items:center;list-style:none}.mehr summary::-webkit-details-marker{display:none}.mehr summary::before{content:'▸ ';font-size:10px;margin-right:4px}.mehr[open] summary::before{content:'▾ '}.mehr p{font-size:14px;color:var(--ink-soft);margin:4px 0 4px 14px}
.absicht{background:var(--brass-tint);border-radius:12px;padding:10px 12px;margin:12px 0}.absicht .fl{margin:0 0 2px;color:var(--brass)}.absicht p{font-family:var(--serif);font-style:italic;color:var(--ink);margin:0 0 6px}.absicht .chips{margin:0}
.hab-track{margin:12px 0 4px}.ht-z{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0}.ht-z .n{font-size:14px}.ht-z .w{display:flex;gap:4px}.ht-z .chip{min-height:30px;padding:3px 9px;font-size:12px}.ht-z .chip.ja.on{background:var(--mint);border-color:var(--mint);color:#fff}.ht-z .chip.nein.on{background:var(--rose);border-color:var(--rose);color:#fff}
.offen{margin:10px 0 4px}.offen-z{display:block;text-align:left;padding:5px 0;font-size:14px;color:var(--ink)}
.skizze{margin:12px 0 4px}.skizze .zf{margin-top:8px}

/* Gewohnheiten */
.abschn{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 6px}.abschn h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}.abschn small{font-size:12px;color:var(--ink-faint)}
.gew{display:flex;gap:4px;margin:0 0 22px;overflow-x:auto;scrollbar-width:none;padding:2px;-webkit-overflow-scrolling:touch}.gew::-webkit-scrollbar{display:none}
.gewb{flex:0 0 auto;min-width:76px;max-width:110px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 6px 6px;border-radius:14px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.gewb .kreis{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;transition:all .18s;font-size:15px}
.gewb[aria-pressed="true"] .kreis{background:var(--hc,var(--mint));border-color:var(--hc,var(--mint));color:#fff}.gewb.miss .kreis{border-style:dashed;border-color:var(--rose)}
.gewb .n{font-size:11.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.gewb .k{font-size:10px;color:var(--ink-faint);font-variant-numeric:tabular-nums;margin-top:-3px;min-height:12px}
.gewb[aria-pressed="true"] .n{color:var(--ink)}.gewb.plus .kreis{border-style:dashed;color:var(--ink-faint);font-size:18px}
.menue .btn{display:flex;width:100%;justify-content:flex-start;padding:0 2px}
.verlauf .raster{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin:10px 0}.verlauf .z{aspect-ratio:1;border-radius:4px;background:var(--line)}.verlauf .z.ok{background:var(--mint)}.verlauf .z.miss{background:var(--rose-tint)}.verlauf .z.leer{background:transparent;border:1px dashed var(--line)}

/* Liste */
.filter{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 0 8px;padding:2px}.filter::-webkit-scrollbar{display:none}.filter .chip{flex:none;min-height:28px;padding:3px 9px;font-size:12px}.filter .chip[aria-pressed="true"]{background:var(--card);border-color:var(--ink);color:var(--ink)}
.liste{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:22px}
.listkopf{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 4px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}.ueberf .listkopf{color:var(--rose)}.ueberf .listkopf .chip{text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink-soft)}
.zeile{position:relative;display:flex;align-items:center;gap:12px;padding:9px 14px 9px 12px;border-top:1px solid var(--line);background:var(--card);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:pan-y;overflow:hidden}
.ohnezeit>.zeile:first-child,.liste>.zeile:first-child{border-top:0}.ohnezeit{min-height:4px}.ohnezeit.ziel{background:var(--rose-tint)}
.zeile .zeit{width:44px;flex:none;font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink-faint);text-align:right;line-height:1.25}.zeile .zeit b{display:block;color:var(--sky);font-weight:600;font-size:13px}.zeile .zeit.leer{color:var(--line)}.zeile.termin .zeit b{color:var(--brass)}
.ck{width:24px;height:24px;border-radius:50%;border:1.8px solid var(--ink-faint);flex:none;display:grid;place-items:center;color:transparent;transition:all .18s;font-size:13px}
.zeile.prio .ck{border-color:var(--rose)}.zeile.done .ck{background:var(--mint);border-color:var(--mint);color:#fff}.zeile.prio.done .ck{background:var(--rose);border-color:var(--rose)}
.zeile .tx{flex:1;min-width:0;text-align:left;padding:2px 0}.zeile .tx b{display:block;font-weight:500;font-size:15.5px;overflow-wrap:anywhere;line-height:1.35}.zeile.prio .tx b{font-weight:650}.zeile.done .tx b{text-decoration:line-through;color:var(--ink-faint)}
.zeile .tx small{display:flex;gap:9px;font-size:11.5px;color:var(--ink-soft);margin-top:2px;flex-wrap:wrap}.zeile .tx small .l{color:var(--sky)}.zeile .tx small .r{color:var(--mint)}.zeile .tx small .d{color:var(--ink-faint)}.zeile .tx small .faellig{color:var(--rose);font-weight:600}
.zeile .play{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;color:var(--ink-faint)}.zeile .play:hover{background:var(--raised);color:var(--ink)}
.zeile.kal{background:var(--raised)}.zeile.kal .tx b{color:var(--ink-soft);font-weight:500}.zeile.kal .ck{border-style:dashed}
.zeile>.inhalt{position:relative;z-index:1;display:flex;align-items:center;gap:12px;width:100%;background:var(--card);margin:-9px -14px -9px -12px;padding:9px 14px 9px 12px}.zeile.kal>.inhalt{background:var(--raised)}
.wisch{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:12px;font-weight:600;color:#fff;background:var(--sky);z-index:0}.wisch.r{background:var(--mint)}.wisch.scharf{font-size:13px}
.zeile.ziel{box-shadow:inset 0 -2px 0 var(--rose)}.zeile.haelt{opacity:.45}
.jetztlinie{height:0;border-top:1.5px solid var(--rose);position:relative;margin:0 0 0 58px}.jetztlinie::before{content:"";position:absolute;left:-5px;top:-4px;width:7px;height:7px;border-radius:50%;background:var(--rose)}
.luecke{display:flex;align-items:center;gap:12px;padding:4px 14px 4px 12px;color:var(--ink-faint);font-size:11.5px;border-top:1px dashed var(--line)}.luecke .zeit{width:44px;text-align:right}.luecke.ziel{background:var(--rose-tint);color:var(--rose)}
.fertig{border-top:1px solid var(--line)}.fertig summary{padding:10px 14px;font-size:12.5px;color:var(--ink-faint);cursor:pointer;list-style:none}.fertig summary::-webkit-details-marker{display:none}.fertig summary::before{content:"▸ ";font-size:10px}.fertig[open] summary::before{content:"▾ "}
.fliegt{position:fixed;z-index:120;transform:translate(-50%,-140%);pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;padding:7px 12px;border-radius:10px;max-width:72vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 10px 24px -8px rgba(0,0,0,.5)}
body.zieht,body.zieht *{cursor:grabbing!important}

/* Eingabe und Leiste unten */
.unten{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bg);border-top:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.unten .in{max-width:600px;margin:0 auto}
.eingabe{display:flex;gap:8px;align-items:center}.unten.ohne-eingabe .eingabe,.unten.ohne-eingabe .erkannt{display:none}
.eingabe input{flex:1;min-width:0;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;font-size:16px;padding:0 14px}.eingabe input::placeholder{color:var(--ink-faint)}
.eingabe button{width:44px;height:44px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:22px;line-height:1;flex:none}
.erkannt{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 0}.erkannt:empty{display:none}
.erkannt .chip{font-size:11.5px;padding:3px 8px;min-height:0;border-radius:6px;background:var(--brass-tint);color:var(--brass);border:0;font-weight:500}.erkannt .chip.zeit,.erkannt .chip.dauer,.erkannt .chip.tageszeit{background:var(--sky-tint);color:var(--sky)}.erkannt .chip.rep{background:var(--mint-tint);color:var(--mint)}.erkannt .chip.prio,.erkannt .chip.termin{background:var(--rose-tint);color:var(--rose)}.erkannt .chip.label,.erkannt .chip.projekt{background:var(--raised);color:var(--ink-soft)}
.erkannt .rest{font-size:11.5px;color:var(--ink-faint);padding:3px 2px}.erkannt .warn{flex-basis:100%;font-size:11.5px;color:var(--rose)}
.tabs{display:flex;justify-content:space-around;margin-top:8px}.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink-faint);padding:4px 10px;border-radius:10px;min-width:56px}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.tabs button[aria-current="page"]{color:var(--ink)}.tabs button.ziel{background:var(--rose-tint);color:var(--rose)}
.fab{display:none}
@media(max-width:700px){.fab{display:none}}

/* Woche */
.ziele{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 18px;margin-bottom:18px}.zk{display:flex;align-items:center;justify-content:space-between;gap:8px}.zk .ebr{margin:0}
.ziel{display:flex;gap:10px;align-items:flex-start;padding:5px 0}.ziel .zi{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink-faint);flex:none;margin-top:4px}.ziel.ok .zi{background:var(--mint);border-color:var(--mint)}.ziel .zt{font-family:var(--serif);font-size:16.5px;line-height:1.5;text-align:left;flex:1;min-width:0;overflow-wrap:anywhere}.ziel.ok .zt{color:var(--ink-faint);text-decoration:line-through}
.ziele-neu input,.cc select{display:block;width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin:6px 0;min-height:40px}
.liste.woche{padding:0 16px 6px}.wtag{padding:8px 0 4px;border-top:1px solid var(--line)}.wtag:first-child{border-top:0}.wtag-h{display:flex;align-items:center;justify-content:space-between;gap:8px}.wtag-h .t{font:600 12px var(--ui);letter-spacing:.03em;text-transform:uppercase;color:var(--ink-soft)}.wtag.heute .wtag-h .t{color:var(--rose)}.wtag.vorbei .wtag-h .t{color:var(--ink-faint)}.wtag.leer{padding:0}.wtag.leer .wtag-h{min-height:36px}.wtag.leer .wtag-h .t{font-weight:500;color:var(--ink-faint)}
.wtag .plus{min-width:36px;min-height:36px;color:var(--ink-faint);font-size:18px;border-radius:8px}.wtag .zeile{border-top:0;padding-left:0;padding-right:0;margin:0}.wtag .zeile>.inhalt{margin:-9px -4px -9px 0;padding:9px 4px 9px 0}.wtag.ziel{background:var(--rose-tint);border-radius:10px}

.ccp{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:2px 0 14px}.ccd{min-height:34px;border:1px solid var(--line);border-radius:8px;font-size:11px;color:var(--ink-soft);padding:4px 6px;line-height:1.2}.ccd.on{border-color:var(--brass);background:var(--brass-tint);color:var(--brass)}.ccd.voll::before{content:'✓ ';font-size:10px}

<script>
(function(){

/* ===== kern.js ===== */
/* ===================== KERN: Werkzeuge, Speicher, Verschlüsselung, Dialoge ===================== */
const APP_VERSION="2026-11-02-centrala2d";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const vonYmd=s=>new Date(Number(s.slice(0,4)),Number(s.slice(5,7))-1,Number(s.slice(8,10)),12);
const addDays=(s,n)=>{ const d=vonYmd(s); d.setDate(d.getDate()+n); return ymd(d); };
const isoWd=s=>{ const n=vonYmd(s).getDay(); return n===0?7:n; };
const wochenStart=s=>addDays(s,1-isoWd(s));
const uhr=m=>pad(Math.floor(m/60))+':'+pad(m%60);

function fmtLang(s){ const d=vonYmd(s); return WDN[isoWd(s)]+', '+d.getDate()+'. '+MONN[d.getMonth()+1]; }
function fmtKurz(s){ const d=vonYmd(s); return WDN[isoWd(s)].slice(0,2)+' '+d.getDate()+'. '+MONN[d.getMonth()+1].slice(0,3)+'.'; }
function isoWoche(s){ const d=vonYmd(s); d.setDate(d.getDate()+4-isoWd(s)); const y0=new Date(d.getFullYear(),0,1); return Math.ceil(((d-y0)/864e5+1)/7); }

/* ---------- Hinweise und Blätter ---------- */

  return ov;
}
function askText(opts){
  return new Promise(resolve=>{
    const f=el('div','frage');
    if(opts.note){ f.append(el('p','notiz',opts.note)); }
    const inp=el(opts.mehrzeilig?'textarea':'input'); if(!opts.mehrzeilig) inp.type='text'; inp.value=opts.value||''; inp.placeholder=opts.placeholder||''; inp.setAttribute('aria-label',opts.title||'Eingabe'); if(opts.mehrzeilig) inp.rows=4;
    f.append(inp);

    const akt=el('div','akt'); const ok=btn(opts.ok||'Speichern',()=>{ done({text:inp.value}); ov.schliessen(); },'btn primär'); const ab=btn('Abbrechen',()=>{ done(null); ov.schliessen(); },'btn leise'); akt.append(ok,ab); f.append(akt);
    const ov=blatt(opts.title||'',f,{onClose:()=>done(null)});

}

    const akt=el('div','akt'); akt.append(btn(okText||'Ja',()=>{ done(true); ov.schliessen(); },'btn primär'),btn('Abbrechen',()=>{ done(false); ov.schliessen(); },'btn leise')); f.append(akt);
    const ov=blatt(titel,f,{onClose:()=>done(false)});

}
function askPassword(opts){
  return new Promise(resolve=>{
    const f=el('div','frage'); if(opts.note) f.append(el('p','notiz',opts.note));

    akt.append(ok,btn('Abbrechen',()=>{ done(null); ov.schliessen(); },'btn leise')); f.append(akt);

}
// Langes Halten löst eine stille Funktion aus (Sprachwechsel, versteckte Knöpfe)
function armSecret(elm, fn){

let cryptoRec=read(K.crypto,null);

function merkeSitzung(pw){ sitzungsPw=pw; clearTimeout(sitzungsTimer); sitzungsTimer=setTimeout(forgetKeys,15*60*1000); }
function hatVerschluesseltes(){
  try{ const p=read(K.privat,{}); const such=o=>{ if(isEnc(o)) return true; if(o&&typeof o==='object') return Object.values(o).some(such); return false; }; return such(p); }catch(e){ return false; }
}
async function ensurePassphrase(){
  if(!subtle()){ toast('Verschlüsselung wird hier nicht unterstützt.'); return null; }

  if(!pruefen){
    const pw=await askPassword({title:'Passwort festlegen',confirm:true,note:'Merke es dir gut – ohne dieses Passwort lassen sich abgelegte Texte nicht wiederherstellen.'});

const GH_API='https://api.github.com', GIST_DESC='centrala-sync', GIST_FILE='centrala.json';

const syncOn=()=>!!(syncCfg&&syncCfg.token&&syncCfg.pw);
const ghHead=extra=>Object.assign({Authorization:'Bearer '+syncCfg.token,Accept:'application/vnd.github+json'},extra||{});

function sammleSync(){ const d={}; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(!k) continue; const mit=(k.startsWith('cz_')&&!LOKAL.includes(k))||ALT_SYNC.includes(k); if(mit) d[k]=localStorage.getItem(k); } return d; }

async function syncPush(force){
  if(!syncOn()||syncBusy) return 'busy';
  const plain=JSON.stringify(sammleSync()); if(!force&&plain===lastPushed) return 'same';
  syncBusy=true; setSyncStatus('sichert …');
  try{
    let salt; if(syncCfg.salt) salt=unb64(syncCfg.salt); else { salt=window.crypto.getRandomValues(new Uint8Array(16)); syncCfg.salt=b64(salt); write(K.sync,syncCfg); }
    const enc=await encWith(syncCfg.pw,salt,plain);
    const body={v:2,app:'centrala',updatedAt:new Date().toISOString(),salt:b64(salt),iv:enc.iv,ct:enc.ct,it:enc.it};
    const payload={description:GIST_DESC,files:{}}; payload.files[GIST_FILE]={content:JSON.stringify(body)};
    let url=GH_API+'/gists', method='POST'; if(syncCfg.gist){ url+='/'+syncCfg.gist; method='PATCH'; } else payload.public=false;
    const r=await fetch(url,{method,headers:ghHead({'Content-Type':'application/json'}),body:JSON.stringify(payload)});
    if(!r.ok){ setSyncStatus(r.status===401?'Token prüfen':'Fehler '+r.status); syncBusy=false; return 'error'; }
    try{ const j=await r.json(); if(j&&j.id&&!syncCfg.gist){ syncCfg.gist=j.id; write(K.sync,syncCfg); } }catch(e){}
    lastPushed=plain; syncCfg.lastAppliedAt=body.updatedAt; write(K.sync,syncCfg); setSyncStatus('aktuell'); syncBusy=false; return 'ok';
  }catch(e){ setSyncStatus('offline'); syncBusy=false; return 'offline'; }
}
async function syncPull(){
  if(!syncOn()||syncBusy) return 'busy';
  syncBusy=true; setSyncStatus('holt …');
  try{
    if(!syncCfg.gist){ const f=await findGist(); if(!f.ok){ setSyncStatus(f.net?'offline':'Token prüfen'); syncBusy=false; return 'error'; } if(!f.id){ syncBusy=false; setSyncStatus('bereit'); return 'none'; } syncCfg.gist=f.id; write(K.sync,syncCfg); }
    const r=await fetch(GH_API+'/gists/'+syncCfg.gist,{headers:ghHead(),cache:'no-store'}); if(!r.ok){ setSyncStatus('Fehler '+r.status); syncBusy=false; return 'error'; }
    const g=await r.json(); const f=g.files&&g.files[GIST_FILE]; if(!f){ syncBusy=false; setSyncStatus('bereit'); return 'none'; }
    let content=f.content; if(f.truncated&&f.raw_url){ const rr=await fetch(f.raw_url,{cache:'no-store'}); content=await rr.text(); }
    const body=JSON.parse(content);

    syncBusy=false; setSyncStatus('aktuell'); ladeAlles(); renderAlles(); return 'ok';
  }catch(e){ setSyncStatus('Abgleich fehlgeschlagen'); syncBusy=false; return 'error'; }
}

/* ---------- Kalender (ICS) ---------- */

  else if(freq==='WEEKLY'){ const tage=byday.length?byday.map(b=>WDMAP[b.slice(-2)]).filter(Boolean):[isoWd(start)]; let w=wochenStart(start); while(guard++<600&&w<=bis){ for(const wd of tage.sort()){ const t=addDays(w,wd-1); if(t<start) continue; if(until&&t>until) break; if(count&&n>=count) break; n++; if(t>=von&&t<=bis&&passt(t)) out.push(t); } w=addDays(w,7*iv); if(count&&n>=count) break; } }

function parseICS(txt){
  const out={}; const VON=addDays(today,-35), BIS=addDays(today,120);

const calKey=(tag,ev)=>tag+'~'+(ev.uid||ev.title);

/* ===================== MODELL: ein Vorhaben, viele Rhythmen ===================== */
let items=[], log={}, tage={}, privat={}, vision={stern:[],jahr:[],quartal:[]}, schatz=[], archiv=[];
function ladeAlles(){
  items=(read(K.items,{all:[]})||{}).all||[]; log=read(K.log,{}); tage=read(K.tage,{}); privat=read(K.privat,{});
  vision=Object.assign({stern:[],jahr:[],quartal:[]},read(K.vision,{})); schatz=read(K.schatz,[]); archiv=read(K.archiv,[]); cfg=read(K.cfg,cfg||{});
}
const saveItems=()=>write(K.items,{all:items});
const saveLog=()=>write(K.log,log);
const saveTage=()=>write(K.tage,tage);
const savePrivat=()=>write(K.privat,privat);
const saveVision=()=>write(K.vision,vision);
const saveSchatz=()=>write(K.schatz,schatz);

function neuesItem(o){ return Object.assign({id:uid(),text:'',day:today,created:new Date().toISOString()},o||{}); }
function addItem(o){ const it=neuesItem(o); items.push(it); saveItems(); return it; }
function delItem(id){ items=items.filter(x=>x.id!==id); Object.keys(log).forEach(d=>{ if(log[d]&&log[d][id]!==undefined) delete log[d][id]; }); saveItems(); saveLog(); }
const byId=id=>items.find(x=>x.id===id);

// Fällt ein wiederkehrendes Vorhaben auf den Tag D?
function faelltAuf(it,D){
  if(!it.rep) return it.day===D;
  if(!it.day||D<it.day) return false; if(it.bis&&D>it.bis) return false;
  const r=it.rep, n=Math.max(1,r.n||1);
  if(r.f==='d'){ const diff=Math.round((vonYmd(D)-vonYmd(it.day))/864e5); return diff%n===0; }
  if(r.f==='w'){ const wd=(r.wd&&r.wd.length)?r.wd:[isoWd(it.day)]; if(!wd.includes(isoWd(D))) return false; const w=Math.round((vonYmd(wochenStart(D))-vonYmd(wochenStart(it.day)))/6048e5); return w%n===0; }

  if(r.f==='y'){ return D.slice(5)===it.day.slice(5)&&((Number(D.slice(0,4))-Number(it.day.slice(0,4)))%n===0); }

}
const istErledigt=(it,D)=>it.rep?((log[D]||{})[it.id]===true):!!it.done;
const istAusgelassen=(it,D)=>it.rep?((log[D]||{})[it.id]==='miss'):false;
function setzeErledigt(it,D,val){
  if(it.rep){ log[D]=log[D]||{}; if(val) log[D][it.id]=true; else delete log[D][it.id]; saveLog(); }
  else { it.done=!!val; it.doneAt=val?new Date().toISOString():null; saveItems(); }
}
function setzeAusgelassen(it,D){ log[D]=log[D]||{}; if(log[D][it.id]==='miss') delete log[D][it.id]; else log[D][it.id]='miss'; saveLog(); }
const habits=()=>items.filter(x=>x.habit&&!x.weg);
const tagesListe=D=>items.filter(x=>!x.habit&&x.kind!=='goal'&&!x.weg&&(x.text||'').trim()&&faelltAuf(x,D));
const ohneTag=()=>items.filter(x=>!x.habit&&x.kind!=='goal'&&!x.weg&&(x.text||'').trim()&&!x.day);
const ueberfaellig=()=>items.filter(x=>!x.habit&&x.kind!=='goal'&&!x.rep&&!x.weg&&!x.done&&(x.text||'').trim()&&x.day&&x.day<today);
function kette(it){ // Tage am Stück, von heute bzw. gestern rückwärts
  let d=today, n=0; if(!istErledigt(it,d)) d=addDays(d,-1);
  for(let g=0; g<3650; g++){ if(!faelltAuf(it,d)){ d=addDays(d,-1); if(d<it.day) break; continue; } if(istErledigt(it,d)) n++; else break; d=addDays(d,-1); }

function habitQuote(it,tageN){ let ok=0, soll=0; for(let i=0;i<tageN;i++){ const d=addDays(today,-i); if(d<it.day) break; if(!faelltAuf(it,d)) continue; soll++; if(istErledigt(it,d)) ok++; } return {ok,soll}; }

// Tagestexte: tage (mitwandernd) und privat (nur dieses Gerät, verschlüsselbar)
const TAGE_KEYS=['absicht','wins','vorsatz','stand','geschlossen','morgenFertig'];
function tagText(D,k){ const q=TAGE_KEYS.includes(k)?tage:privat; return (q[D]&&q[D][k]!==undefined)?q[D][k]:''; }
function setTagText(D,k,v){ const q=TAGE_KEYS.includes(k)?tage:privat; q[D]=q[D]||{}; if(v===''||v===null||v===undefined) delete q[D][k]; else q[D][k]=v; if(!Object.keys(q[D]).length) delete q[D]; if(q===tage) saveTage(); else savePrivat(); }

// Aufräumen: Erledigtes von früher wandert ins Archiv, Haken älterer Tage bleiben
function aufraeumen(){
  const grenze=addDays(today,-14); let geaendert=false;
  items=items.filter(x=>{ if(!x.rep&&x.done&&x.day&&x.day<grenze&&x.kind!=='goal'){ archiv.unshift({text:x.text,day:x.day,doneAt:x.doneAt,labels:x.labels}); geaendert=true; return false; } return true; });
  if(geaendert){ archiv=archiv.slice(0,400); saveItems(); write(K.archiv,archiv); }
}

/* ---------- Übernahme aus der bisherigen Centrala ---------- */

    Object.keys(e).forEach(k=>{ if(/skizze|zeichnung|draw/i.test(k)) privat[d].skizze=e[k]; });
    if(!Object.keys(privat[d]).length) delete privat[d]; if(!Object.keys(tage[d]).length) delete tage[d]; });
  // Spontane Notizen, Command Center
  const ms=alt('ht_metanotiz_v1'); if(Array.isArray(ms)&&ms.length) privat.notizen=ms.map(n=>({id:n.id||uid(),d:n.d,at:n.at,t:n.t}));

  [...sz,...qs].forEach(q=>{ const t=(q.text||'').trim(); if(!t||seen.has(t)) return; seen.add(t); schatz.push({id:q.qid||q.id||uid(),text:t,author:q.author||''}); });

  const cr=alt('ht_crypto_v1'); if(cr&&cr.salt){ cryptoRec=cr; write(K.crypto,cr); }

  return bericht;
}

/* ---------- Gesten: wischen (Finger), ziehen (Finger nach Halten, Maus sofort) ---------- */
function gesten(z,x,D){
  let x0=0,y0=0,pid=null,modus=null,dx=0,halt=null,bg=null,ghost=null,ziel=null,sperre=false,rollen=null;
  const line=z.querySelector('.inhalt');
  const wischZeig=d=>{ dx=Math.max(-150,Math.min(150,d)); if(!bg){ bg=el('div','wisch'); bg.innerHTML='<span>✓ erledigt</span><span>neu planen</span>'; z.prepend(bg); z.classList.add('wischt'); } bg.classList.toggle('r',dx>0); bg.classList.toggle('scharf',Math.abs(dx)>=72); line.style.transform='translateX('+dx+'px)'; };

function cleanText(t){ return String(t||'').replace(/<br\s*\/?>/gi,'\n').replace(/<\/p>/gi,'\n\n').replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/\n{3,}/g,'\n\n').trim(); }
function rText(v){ const raw=String(v||''); if(/(?:wrong param|Reader Evangelizo|<\s*!doctype|<\s*(?:html|script|iframe)\b|\b(?:Fatal error|Warning):)/i.test(raw)) return ''; const e=document.createElement('textarea'); e.innerHTML=cleanText(raw); return e.value.trim(); }
function rSafeURL(v){ try{ const u=new URL(v); return u.protocol==='https:'?u.href:''; }catch(e){ return ''; } }
function extractStelle(v){ const lines=rText(v).split('\n').slice(0,8); for(const line of lines){ const m=line.match(/\b((?:[1-3]\.?(?:\s+)?)?[A-ZÄÖÜ][A-Za-zÄÖÜäöüß]+\.?\s+\d{1,3}(?:\s*\(\d{1,3}\))?\s*[,.:]\s*\d{1,3}[a-z]{0,3}(?:\s*[-–—.,;]\s*\d{1,3}[a-z]{0,3})*)/); if(m) return m[1].replace(/\s+/g,' ').replace(/[.,;]$/,'').trim(); } return ''; }

    return ymd(new Date(y, mo-1, da));
  }

    const zu=document.createElement("button"); zu.type="button"; zu.className="ang-close";

  /* ---------- Psalm 23 (Vulgata 22) ----------

  const PSTEXT="ht_psalmtext_v1";   // eigener Wortlaut je Sprache
  // Der Wortlaut, der gerade gilt: eigener, sonst der mitgelieferte
  function psVerse(l){
    const eig=(read(PSTEXT,{})||{})[l];
    if(typeof eig==="string" && eig.trim()){
      return eig.split(/\n\s*\n/).map((abs,i)=>[String(i+1), abs.replace(/\s*\n\s*/g," ").trim()])
                .filter(x=>x[1]);
    }
    return PSALM23[l];
  }

  const PSALM23={
    de:[["1","Ein Psalm Davids. Der Herr ist mein Hirt, mir wird nichts mangeln;"],
        ["2","auf einem Weideplatze lässt er mich lagern, an Wasser der Erquickung leitet er mich;"],
        ["3","er erquickt meine Seele, führt mich auf Pfaden der Gerechtigkeit, um seines Namens willen."],
        ["4","Denn ob ich auch mitten durch Todesschatten wandelte, fürchte ich doch kein Unglück; bist du doch bei mir. Dein Stecken und dein Stab trösten mich."],
        ["5","Du deckst vor meinem Angesichte einen Tisch im Angesichte meiner Bedränger, salbst mein Haupt mit Öl, und mein überströmender Becher, wie herrlich ist er!"],
        ["6","Deine Gnade geleitet mich alle Tage meines Lebens und ich darf wohnen im Hause des Herrn immerdar."]],
    la:[["1","Psalmus David. Dominus regit me, et nihil mihi deerit:"],
        ["2","In loco pascuæ ibi me collocavit. Super aquam refectionis educavit me:"],
        ["3","Animam meam convertit. Deduxit me super semitas justitiæ, propter nomen suum."],

        ["5","Parasti in conspectu meo mensam, adversus eos, qui tribulant me. Impinguasti in oleo caput meum: et calix meus inebrians quam præclarus est!"],
        ["6","Et misericordia tua subsequetur me omnibus diebus vitæ meæ: Et ut inhabitem in domo Domini, in longitudinem dierum."]],
    hr:[["1","Psalam Davidov. Gospodin je pastir moj, ni u čem ja ne oskudijevam;"],
        ["2","na poljanama zelenim on mi daje odmora. Na vrutke me tihane vodi"],

  // Zum Auswendiglernen: erst alles, dann jedes zweite Wort, dann nur Anfänge, dann nichts
  function psVerdecken(text, stufe){
    if(stufe===0) return esc(text);
    return text.split(/(\s+)/).map(w=>{
      if(/^\s+$/.test(w)) return w;
      const rein=w.replace(/[^\wÄÖÜäöüßæ]/g,"");
      if(!rein) return esc(w);
      if(stufe===1 && Math.abs(hashWort(rein))%2===0) return esc(w);
      if(stufe===2) return `<span class="ps-w">${esc(w.slice(0,1))}<span class="ps-l">${"·".repeat(Math.max(1,rein.length-1))}</span></span>`;
      if(stufe===3) return `<span class="ps-w"><span class="ps-l">${"·".repeat(rein.length)}</span></span>`;
      return `<span class="ps-w"><span class="ps-l">${"·".repeat(rein.length)}</span></span>`;
    }).join("");
  }
  function hashWort(w){ let h=0; for(let i=0;i<w.length;i++) h=(h*31+w.charCodeAt(i))|0; return h; }

  function openPsalm(){
    document.querySelectorAll(".ang-overlay").forEach(x=>x.remove());

    box.appendChild(h);

    // Lernstufen
    const st=document.createElement("div"); st.className="ps-stufen";
    ["ganzer Text","halb verdeckt","nur Anfänge","aus dem Kopf"].forEach((t,i)=>{
      const b=document.createElement("button"); b.type="button"; b.className="ps-s"+(psStufe===i?" on":"");

    box.appendChild(st);

    const t=document.createElement("div"); t.className="ps-text";

      z.addEventListener("click",()=>{

    // Eigenen Wortlaut einsetzen — Absätze werden zu Versen

      const grow=()=>{ ta.style.height="auto"; ta.style.height=Math.max(200,ta.scrollHeight)+"px"; };
      ta.addEventListener("input",()=>{ const o=read(PSTEXT,{})||{}; o[l]=ta.value; write(PSTEXT,o); grow(); });

      eb.appendChild(ta);
      const z2=document.createElement("div"); z2.className="cc-feld-akt";
      const f=document.createElement("button"); f.type="button"; f.className="key-btn"; f.textContent="fertig";
      f.addEventListener("click",()=>{ psEdit=false; openPsalm(); });
      z2.appendChild(f);
      if(psEigen(l)){
        const zk=document.createElement("button"); zk.type="button"; zk.className="key-btn del"; zk.textContent="zurücksetzen";
        zk.addEventListener("click",()=>{ const o=read(PSTEXT,{})||{}; delete o[l]; write(PSTEXT,o); psEdit=false; openPsalm(); });

      const e=document.createElement("button"); e.type="button"; e.className="ps-edit";
      e.textContent = psEigen(l) ? "eigener Wortlaut · ändern" : "eigenen Wortlaut einsetzen";
      e.addEventListener("click",()=>{ psEdit=true; openPsalm(); });
      eb.appendChild(e);
    }
    box.appendChild(eb);

    const q=document.createElement("p"); q.className="kru-note";
    q.textContent = l==="la" ? "Vulgata · Psalmus 22"
      : l==="hr" ? "Psalam 23 · antipanjem se otkriva redak"

    box.appendChild(q);

    const acts=document.createElement("div"); acts.className="ang-acts";
    const done=document.createElement("button"); done.type="button"; done.className="ang-done"+(psPrayed()?" on":"");
    done.textContent=psPrayed()?"gebetet ✓":"gebetet";
    done.addEventListener("click",()=>{ psMark(); openPsalm(); renderHeute(); });
    const zu=document.createElement("button"); zu.type="button"; zu.className="ang-close"; zu.textContent="schließen";
    zu.addEventListener("click",()=>ov.remove());
    acts.append(done,zu); box.appendChild(acts);

    ov.appendChild(box);
    ov.addEventListener("click",e=>{ if(e.target===ov) ov.remove(); });
    document.body.appendChild(ov);
  }

  function openLitanei(){
    document.querySelectorAll(".ang-overlay").forEach(x=>x.remove());
    loadAng();
    const hr=(ang.lang==="hr");   // Latein gibt es hier nicht, dann gilt Deutsch
    const head = hr?LITANEI_HR_HEAD:LITANEI_HEAD;
    const bf   = hr?LITANEI_HR_BEFREI:LITANEI_BEFREI;
    const gn   = hr?LITANEI_HR_GNADE:LITANEI_GNADE;
    const rBefrei = hr?"oslobodi me, Isuse.":"befreie mich, o Jesus.";
    const rGnade  = hr?"daj mi milost da to želim.":"gib mir die Gnade, es zu wünschen.";
    const ov=document.createElement("div"); ov.className="ang-overlay open";
    const box=document.createElement("div"); box.className="ang-box lit-box";
    const h=document.createElement("div"); h.className="ang-h";
    h.innerHTML=`<span class="ang-k secret">${hr?"Litanija poniznosti":"Litanei der Demut"}</span>`+
      (hr?`<span class="ang-lang">hrvatski</span>`:``);
    armSecret(h.querySelector(".ang-k"), ()=>{ ang.lang=(ang.lang==="hr")?"de":"hr"; saveAng(); openLitanei(); });

    html+=`<p class="lit-sep">${hr?"Da drugi…":"Um die Gnade, zu wünschen…"}</p>`;
    html+=gn.map(l=>`<p class="ang-l lit-l">${esc(l)}<span class="lit-r">${esc(rGnade)}</span></p>`).join("");

    done.textContent=litPrayed()?"gebetet ✓":"gebetet";

    document.body.appendChild(ov);
  }

  let kruOffen=null;
  let kruSet=null;   // null = Geheimnis des Tages
  function openKrunica(setId){
    document.querySelectorAll(".ang-overlay").forEach(x=>x.remove());
    loadAng();
    const hr=(ang.lang==="hr");
    const cur = setId ? KRUNICA.find(k=>k.id===setId) : krunicaToday();
    kruSet = setId || null;
    const ov=document.createElement("div"); ov.className="ang-overlay open";
    const box=document.createElement("div"); box.className="ang-box kru-box";

    const h=document.createElement("div"); h.className="ang-h";
    h.innerHTML=`<span class="ang-k secret">${hr?"Krunica":"Rosenkranz"}</span>`+(hr?`<span class="ang-lang">hrvatski</span>`:``);
    armSecret(h.querySelector(".ang-k"), ()=>{ ang.lang=hr?"de":"hr"; saveAng(); openKrunica(kruSet); });
    box.appendChild(h);

    // Geheimnis des Tages, andere Sätze wählbar
    const tabs=document.createElement("div"); tabs.className="kru-tabs";
    KRUNICA.forEach(k=>{
      const isToday=(k.id===krunicaToday().id);
      const b=document.createElement("button"); b.type="button";
      b.className="kru-tab"+(k.id===cur.id?" on":"")+(isToday?" heute":"");
      b.textContent=hr?k.hr:k.de;
      b.title=isToday?(hr?"današnja otajstva":"Geheimnisse des heutigen Tages"):"";
      b.addEventListener("click",()=>openKrunica(k.id));
      tabs.appendChild(b);

/* ===== alt/zeichnen-kern.js ===== */
  /* ---------- Zeichenfläche ----------
     Für Apple Pencil gebaut: Druckstärke bestimmt die Strichbreite, die Handballen-
     auflage wird abgewiesen, sobald ein Stift erkannt wurde. Gespeichert werden
     die Striche als Text — dadurch greift derselbe Schutz wie bei allen Feldern. */
  const ZEICHEN_H = 260;

  /* ---------- Zeichenfläche ----------
     Für Apple Pencil gebaut. Drei Dinge machen den Unterschied zu billig wirkenden
     Flächen: es wird nur das neue Stück gezeichnet statt alles neu, die Strichbreite
     folgt Druck UND Geschwindigkeit (schnell = dünn, wie echte Tinte), und beides
     wird geglättet, damit die Linie nicht zappelt. */
  const ZF_STIFT = "ht_stift_v1";   // merkt sich, dass dieses Gerät einen Stift hat
  const ZF_H = 620;        // Grundhöhe
  const ZF_MEHR = 420;     // was ein Druck auf „mehr Platz“ hinzufügt
  const ZF_FARBEN = [
    ["tinte",  "#1C1C1E"],
    ["blau",   "#2C6BED"],
    ["rot",    "#D0342C"],
    ["gruen",  "#1F8A4C"],
    ["messing","#B8873A"]
  ];
  let zfFarbe = 0, zfRadiert = false, zfDicke = 1;

  function zeichenFlaeche(hol, leg, neu, ro){
    const box = document.createElement("div"); box.className = "zf";
    const feld = document.createElement("div"); feld.className = "zf-feld";
    const cv = document.createElement("canvas"); cv.className = "zf-cv";
    feld.appendChild(cv); box.appendChild(feld);

    // Ein Zug: {f:Farbindex, d:Dicke, p:[[x,y,breite], …]}
    let zuege = [];
    try {
      const roh = hol();
      if (typeof roh === "string" && roh.trim()) {
        const j = JSON.parse(roh);
        zuege = Array.isArray(j) ? j.map(z => Array.isArray(z) ? {f:0,d:1,p:z} : z) : [];
      }
    } catch (e) { zuege = []; }

    let stiftGesehen = (()=>{ try{ return localStorage.getItem(ZF_STIFT)==="1"; }catch(e){ return false; } })();
    let aktuellTyp = null, aktuell = null, ctx = null;
    let breite = 0, hoehe = ZF_H, dpr = 1;
    let extra = 0;   // wie oft „mehr Platz“ gedrückt wurde
    let letzterPunkt = null, letzteBreite = null, letzteZeit = 0;

    const messen = () => {
      const r = cv.getBoundingClientRect();
      dpr = Math.min(3, window.devicePixelRatio || 1);
      breite = Math.max(1, Math.round(r.width));
      hoehe = ZF_H + extra * ZF_MEHR;
      cv.width  = Math.round(breite * dpr);
      cv.height = Math.round(hoehe * dpr);
      cv.style.height = hoehe + "px";
      ctx = cv.getContext("2d", { desynchronized: true }) || cv.getContext("2d");
      if(!ctx) return;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
    };

    const farbeVon = i => ZF_FARBEN[Math.max(0, Math.min(ZF_FARBEN.length-1, i|0))][1];

    // Ein einzelnes Segment — das ist der Kern: es wird nur das gezeichnet,
    // was neu dazugekommen ist, nie die ganze Fläche.
    /* Ein Segment wird als gefülltes Band gezeichnet, das an beiden Enden
       unterschiedlich breit sein darf. Dadurch läuft die Breite stufenlos mit
       und es entstehen keine Absätze zwischen den Teilstücken. */
    const segment = (a, b, hex, radiert) => {
      const dx = b[0]-a[0], dy = b[1]-a[1];
      const len = Math.hypot(dx, dy);
      ctx.save();
      if (radiert) { ctx.globalCompositeOperation = "destination-out"; ctx.fillStyle = "rgba(0,0,0,1)"; }
      else ctx.fillStyle = hex;
      const ha = Math.max(.35, a[2]/2), hb = Math.max(.35, b[2]/2);
      if (len < .01) {
        ctx.beginPath(); ctx.arc(b[0], b[1], hb, 0, Math.PI*2); ctx.fill();
        ctx.restore(); return;
      }
      const nx = -dy/len, ny = dx/len;          // Senkrechte zur Richtung
      const w1 = Math.atan2(ny, nx), w2 = Math.atan2(-ny, -nx);
      ctx.beginPath();
      ctx.moveTo(a[0]+nx*ha, a[1]+ny*ha);
      ctx.lineTo(b[0]+nx*hb, b[1]+ny*hb);
      ctx.arc(b[0], b[1], hb, w1, w2, false);   // runde Kuppe vorn
      ctx.lineTo(a[0]-nx*ha, a[1]-ny*ha);
      ctx.arc(a[0], a[1], ha, w2, w1, false);   // runde Kuppe hinten
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    };

    const zugMalen = (z) => {
      const hex = farbeVon(z.f), rad = z.f === -1;
      const p = z.p || [];
      if (p.length === 1) {
        ctx.save();
        if (rad) ctx.globalCompositeOperation = "destination-out";
        ctx.fillStyle = rad ? "rgba(0,0,0,1)" : hex;
        ctx.beginPath(); ctx.arc(p[0][0], p[0][1], p[0][2]/2, 0, Math.PI*2); ctx.fill();
        ctx.restore(); return;
      }
      for (let i = 1; i < p.length; i++) segment(p[i-1], p[i], hex, rad);
    };

    const alles = () => {
      if (!ctx) return;
      ctx.clearRect(0, 0, breite, hoehe);
      zuege.forEach(zugMalen);
      if (aktuell) zugMalen(aktuell);
      leer.hidden = zuege.length > 0 || !!aktuell;
    };

    const sichern = () => leg((zuege.length || extra) ? JSON.stringify({z:zuege, e:extra}) : "");

    // Ein nachlaufender Punkt: die Linie folgt dem Zeiger gedämpft statt roh
    let glattX = null, glattY = null;
    const glaetten = (x, y, neu) => {
      if (neu || glattX == null) { glattX = x; glattY = y; }
      else { glattX = glattX + (x - glattX) * .62; glattY = glattY + (y - glattY) * .62; }
      return [glattX, glattY];
    };

    // Neigung: 0 = senkrecht, 1 = flach. Safari liefert altitudeAngle, sonst tiltX/Y
    const neigung = (e) => {
      if (typeof e.altitudeAngle === "number")
        return Math.max(0, Math.min(1, 1 - e.altitudeAngle / (Math.PI/2)));
      const tx = e.tiltX||0, ty = e.tiltY||0;
      const t = Math.min(90, Math.hypot(tx, ty));
      return t/90;
    };

    const roh = (e) => {
      const r = cv.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top,
               dr: (typeof e.pressure === "number" && e.pressure > 0) ? e.pressure : .5,
               neig: e.pointerType === "pen" ? neigung(e) : 0,
               stift: e.pointerType === "pen" };
    };

    /* Strichbreite: Grundbreite mal Druck, verjüngt durch Geschwindigkeit.
       Danach geglättet, sonst springt die Linie bei jedem Messwert. */
    const breiteFuer = (p, jetzt) => {
      const basis = (zfRadiert ? 20 : 4.6) * zfDicke;
      let w;
      if (zfRadiert) w = basis;
      else {
        let druck = p.stift ? (.5 + p.dr * 1.1) : 1;
        // Flach gehaltener Stift zieht breiter, wie eine echte Mine
        if (p.stift && p.neig > 0) druck *= 1 + Math.min(.7, p.neig * .9);
        let tempo = 0;
        if (letzterPunkt && jetzt > letzteZeit) {
          const dx = p.x - letzterPunkt.x, dy = p.y - letzterPunkt.y;
          tempo = Math.hypot(dx, dy) / Math.max(1, jetzt - letzteZeit);  // px je ms
        }
        const duenner = 1 / (1 + Math.min(1.4, tempo * .55));
        w = basis * druck * (.74 + .26 * duenner);
      }
      if (letzteBreite == null) letzteBreite = w;
      letzteBreite = letzteBreite * .72 + w * .28;     // Glättung
      return Math.max(1.5, letzteBreite);
    };

    /* Der Handballen liegt fast immer VOR der Spitze auf. Deshalb genügt es nicht,
       den Stift erst beim Aufsetzen zu erkennen — wir merken uns über Sitzungen
       hinweg, dass dieses Gerät einen Stift hat, und nehmen dann nur noch ihn. */
    const nimmt = (e) => {
      if (ro) return false;
      if (e.pointerType === "pen") {
        if (!stiftGesehen) { stiftGesehen = true; try{ localStorage.setItem(ZF_STIFT,"1"); }catch(x){} }
        // Ein Finger-Zug, der gerade läuft, war der Handballen — verwerfen
        if (aktuell && aktuellTyp !== "pen") { aktuell = null; alles(); }
        return true;
      }
      if (stiftGesehen) return false;      // Finger und Handballen bleiben draußen
      return true;
    };

    const runter = (e) => {
      if (!nimmt(e)) return;
      e.preventDefault();
      cv.setPointerCapture && cv.setPointerCapture(e.pointerId);
      const jetzt = performance.now();
      letzterPunkt = null; letzteBreite = null; letzteZeit = jetzt;
      const p = roh(e);
      const g0 = glaetten(p.x, p.y, true); p.x = g0[0]; p.y = g0[1];
      const w = breiteFuer(p, jetzt);
      aktuellTyp = e.pointerType;
      aktuell = { f: zfRadiert ? -1 : zfFarbe, d: zfDicke, p: [[r1(p.x), r1(p.y), r1(w)]] };
      letzterPunkt = p; letzteZeit = jetzt;
      zugMalen(aktuell);
      leer.hidden = true;
    };

    const zieht = (e) => {
      if (!aktuell || !nimmt(e)) return;
      e.preventDefault();
      const folge = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
      folge.forEach(x => {
        const jetzt = performance.now();
        const p = roh(x);
        const g = glaetten(p.x, p.y, false); p.x = g[0]; p.y = g[1];
        const w = breiteFuer(p, jetzt);
        const neuP = [r1(p.x), r1(p.y), r1(w)];
        const vor = aktuell.p[aktuell.p.length - 1];
        const weg = Math.hypot(neuP[0]-vor[0], neuP[1]-vor[1]);
        if (weg < .28) return;              // Zittern an Ort und Stelle überspringen
        const hex = farbeVon(aktuell.f), rad = aktuell.f === -1;
        // Bei großen Sprüngen Zwischenpunkte setzen, damit die Kurve rund bleibt
        const stufen = weg > 9 ? Math.min(8, Math.ceil(weg/4.5)) : 1;
        let letzt = vor;
        for (let k = 1; k <= stufen; k++) {
          const t = k/stufen;
          const zw = [ r1(vor[0] + (neuP[0]-vor[0])*t),
                       r1(vor[1] + (neuP[1]-vor[1])*t),
                       r1(vor[2] + (neuP[2]-vor[2])*t) ];
          segment(letzt, zw, hex, rad);
          aktuell.p.push(zw);
          letzt = zw;
        }
        letzterPunkt = p; letzteZeit = jetzt;
      });
    };

    const hoch = () => {
      if (!aktuell) return;
      if (aktuell.p.length) zuege.push(aktuell);
      aktuell = null; letzterPunkt = null; letzteBreite = null;
      sichern(); knoepfe(); leer.hidden = zuege.length > 0;
    };
    const r1 = n => Math.round(n * 10) / 10;

    cv.addEventListener("pointerdown", runter);
    cv.addEventListener("pointermove", zieht);
    ["pointerup", "pointercancel", "pointerleave"].forEach(t => cv.addEventListener(t, hoch));

    feld.appendChild(leer);

    /* ---- Werkzeugleiste ---- */
    const bar = document.createElement("div"); bar.className = "zf-bar";

    const farben = document.createElement("div"); farben.className = "zf-farben";
    ZF_FARBEN.forEach(([name, hex], i) => {
      const b = document.createElement("button"); b.type = "button";
      b.className = "zf-f" + (!zfRadiert && zfFarbe === i ? " on" : "");
      b.style.setProperty("--c", hex);
      b.title = name;
      b.addEventListener("click", () => { zfFarbe = i; zfRadiert = false; leisteAuf(); });
      farben.appendChild(b);
    });
    bar.appendChild(farben);

    const rad = document.createElement("button"); rad.type = "button";
    rad.className = "zf-rad" + (zfRadiert ? " on" : "");
    rad.textContent = "Radierer";
    rad.addEventListener("click", () => { zfRadiert = !zfRadiert; leisteAuf(); });
    bar.appendChild(rad);

    const dicken = document.createElement("div"); dicken.className = "zf-dicken";
    [[.6,"fein"],[1,"mittel"],[1.8,"breit"]].forEach(([v, t]) => {
      const b = document.createElement("button"); b.type = "button";
      b.className = "zf-d" + (zfDicke === v ? " on" : "");
      b.title = t;
      b.innerHTML = `<span style="height:${Math.round(v*4+1)}px"></span>`;
      b.addEventListener("click", () => { zfDicke = v; leisteAuf(); });
      dicken.appendChild(b);
    });
    bar.appendChild(dicken);

    const zurueck = document.createElement("button"); zurueck.type = "button"; zurueck.className = "zf-btn";
    zurueck.textContent = "zurück";
    zurueck.addEventListener("click", () => { zuege.pop(); alles(); sichern(); knoepfe(); });
    const mehr = document.createElement("button"); mehr.type = "button"; mehr.className = "zf-btn";
    mehr.textContent = "mehr Platz";
    mehr.title = "Die Seite wird länger";
    mehr.addEventListener("click", () => { extra++; messen(); alles(); sichern(); });
    const weg = document.createElement("button"); weg.type = "button"; weg.className = "zf-btn";
    weg.textContent = "leeren";
    weg.addEventListener("click", () => {
      if (!zuege.length) return;
      if (!confirm("Zeichnung löschen?")) return;
      zuege = []; alles(); sichern(); knoepfe();
    });
    bar.append(zurueck, mehr, weg);
    if (!ro) box.appendChild(bar);

    function leisteAuf(){
      farben.querySelectorAll(".zf-f").forEach((b, i) =>
        b.classList.toggle("on", !zfRadiert && zfFarbe === i));
      rad.classList.toggle("on", zfRadiert);
      dicken.querySelectorAll(".zf-d").forEach((b, i) =>
        b.classList.toggle("on", zfDicke === [.6,1,1.8][i]));
    }
    function knoepfe(){
      zurueck.disabled = !zuege.length;
      weg.disabled = !zuege.length;
    }

    requestAnimationFrame(() => { messen(); alles(); knoepfe(); leisteAuf(); });
    if (typeof ResizeObserver === "function") {
      let vor = 0;
      new ResizeObserver(() => {
        const b = Math.round(cv.getBoundingClientRect().width);
        if (b && b !== vor) { vor = b; messen(); alles(); }
      }).observe(cv);
    }
    return box;
  }

  // Schutz
  gruppe('Schutz',[zeileM('Verschlüsselung',cryptoRec?(sitzungsPw?'Passwort in dieser Sitzung bekannt':'Passwort festgelegt'):'noch kein Passwort – wird beim ersten Ablegen festgelegt',async()=>{ if(sitzungsPw){ forgetKeys(); offen.clear(); toast('Sitzung beendet – abgelegte Texte sind wieder zu.'); renderAlles(); } else { const pw=await ensurePassphrase(); if(pw) toast('Passwort für diese Sitzung gemerkt.'); renderMehr(); } }),

    zeileM('Sicherung einlesen','ersetzt die Daten auf diesem Gerät',()=>sicherungImport()),

  const v=el('p','leise version','Centrala '+APP_VERSION); armSecret(v,allesLoeschen); root.append(v);

function themeAnwenden(){ const t=cfg.theme||'auto'; if(t==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',t); }
async function syncEinrichten(){
  const f=el('div','editor'); f.append(el('p','notiz','Ein privater GitHub-Gist trägt die Daten – verschlüsselt mit einem Passwort, das nur du kennst. Auf jedem Gerät dasselbe Token und dasselbe Passwort eintragen.'));
  const tok=el('input'); tok.type='password'; tok.placeholder='GitHub-Token (gist)'; tok.value=syncCfg&&syncCfg.token||''; const l1=el('label','','Token'); l1.append(tok);
  const pw=el('input'); pw.type='password'; pw.placeholder='Abgleich-Passwort'; pw.value=syncCfg&&syncCfg.pw||''; const l2=el('label','','Passwort'); l2.append(pw); f.append(l1,l2);
  const akt=el('div','akt'); akt.append(btn('Speichern und abgleichen',async()=>{ if(!tok.value.trim()||!pw.value){ toast('Token und Passwort nötig.'); return; } syncCfg=Object.assign({},syncCfg||{},{token:tok.value.trim(),pw:pw.value}); delete syncCfg.gist; delete syncCfg.lastAppliedAt; write(K.sync,syncCfg); ov.schliessen(); setSyncStatus('prüft …'); const r=await syncPull(); if(r==='error'){ toast('Abgleich: '+syncStatus); } else { await syncPush(true); toast('Abgleich eingerichtet.'); } renderMehr(); },'btn primär')); f.append(akt);
  const ov=blatt('Abgleich',f);
}
async function passwortAendern(){
  if(!cryptoRec){ toast('Noch kein Passwort vorhanden.'); return; }
  const alt=await ensurePassphrase(); if(!alt) return;
  const neu=await askPassword({title:'Neues Passwort',confirm:true}); if(!neu) return;
  const salt=window.crypto.getRandomValues(new Uint8Array(16)); let n=0;
  const um=async v=>{ if(!isEnc(v)) return v; const t=await decWith(alt,unb64(cryptoRec.salt),v); n++; return encWith(neu,salt,t); };
  for(const d of Object.keys(privat)){ const e=privat[d]; if(e&&typeof e==='object'&&!Array.isArray(e)) for(const k of Object.keys(e)) e[k]=await um(e[k]); }
  if(Array.isArray(privat.notizen)) for(const z of privat.notizen) z.t=await um(z.t);
  if(vision.prosa) vision.prosa=await um(vision.prosa);
  cryptoRec={salt:b64(salt),check:await encWith(neu,salt,'ok')}; write(K.crypto,cryptoRec); savePrivat(); saveVision(); forgetKeys(); merkeSitzung(neu); offen.clear(); toast(n+' Texte neu verschlüsselt.'); renderMehr();
}

function sicherungExport(){
  const d={}; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&(k.startsWith('cz_')||k.startsWith('ht_'))&&k!==K.sync) d[k]=localStorage.getItem(k); }

}
function sicherungImport(){
